    sampleQueries:
      - title: "Fleet-average WTT (days) by month"
        sql: |
          SELECT
            DATE_TRUNC('month', cycle_start_ts_utc) :: DATE AS month_start,
            COUNT(*)                                 AS cycle_count,
            AVG(total_cycle_duration_hr) / 24.0      AS avg_wtt_days,
            PERCENTILE_CONT(0.5)
              WITHIN GROUP (ORDER BY total_cycle_duration_hr) / 24.0 AS median_wtt_days,
            PERCENTILE_CONT(0.9)
              WITHIN GROUP (ORDER BY total_cycle_duration_hr) / 24.0 AS p90_wtt_days
          FROM gold_logistics.fact_wagon_cycle
          WHERE product_code IN ('MN-LUMP','MN-SINT')
            AND cycle_start_date_utc >= DATE '2024-01-01'
          GROUP BY 1
          ORDER BY 1 DESC;
        expectedOutcome: "1 row per month; avg_wtt_days central metric for KPI-01 dashboard."

      - title: "Port dwell by corridor (last 30 days) — which corridor waits longest at port?"
        sql: |
          SELECT
            origin_corridor_id,
            COUNT(*)                                             AS n,
            AVG(port_dwell_pre_unload_hr)                        AS mean_hr,
            PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY port_dwell_pre_unload_hr) AS p90_hr
          FROM gold_logistics.fact_wagon_cycle
          WHERE cycle_start_date_utc >= CURRENT_DATE - INTERVAL 30 DAYS
            AND product_code IN ('MN-LUMP','MN-SINT')
          GROUP BY 1
          HAVING n >= 100
          ORDER BY mean_hr DESC;
        expectedOutcome: "Rows per corridor; identify the corridor with worst port bottleneck."

      - title: "OTIF % by product, rolling 28 days"
        sql: |
          WITH daily AS (
            SELECT
              cycle_start_date_utc,
              product_code,
              COUNT(*)                                            AS shipments,
              COUNT_IF(otif_flag)                                 AS on_time_in_full
            FROM gold_logistics.fact_wagon_cycle
            WHERE product_code IN ('MN-LUMP','MN-SINT')
              AND cycle_start_date_utc >= CURRENT_DATE - INTERVAL 56 DAYS
            GROUP BY 1, 2
          )
          SELECT
            cycle_start_date_utc AS report_date,
            product_code,
            SUM(shipments) OVER (
              PARTITION BY product_code
              ORDER BY cycle_start_date_utc
              ROWS BETWEEN 27 PRECEDING AND CURRENT ROW
            ) AS rolling28_shipments,
            ROUND(100.0 * SUM(on_time_in_full) OVER (
              PARTITION BY product_code
              ORDER BY cycle_start_date_utc
              ROWS BETWEEN 27 PRECEDING AND CURRENT ROW
            ) / NULLIF(SUM(shipments) OVER (
              PARTITION BY product_code
              ORDER BY cycle_start_date_utc
              ROWS BETWEEN 27 PRECEDING AND CURRENT ROW
            ), 0), 2) AS rolling28_otif_pct
          FROM daily
          ORDER BY report_date DESC, product_code
          LIMIT 10;
        expectedOutcome: "Rolling 28-day OTIF %, useful for trend visualizations that smooth weekly seasonality."

